<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prospection Distributeurs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#eceff1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111417" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Direction : la façade d'un distributeur. Acier brossé (fonds), panneau émaillé (surfaces),
   laiton du monnayeur (une seule couleur d'action), voyants de sélection (états).
   Mise en page : une colonne à une main ; l'action principale est toujours sous le pouce.
   Profondeur : bordures fines et changements de teinte ; ombre réservée au calque flottant
   (barre de résultats, feuille, toast). Échelle typographique 1,25 à partir de 17 px. */
:root {
  --steel:      #eceff1;  /* fond de page */
  --panel:      #ffffff;  /* surfaces */
  --panel-sunk: #f3f5f6;  /* champs de saisie, zones en creux */
  --rule:       rgba(21, 32, 43, .12);
  --rule-strong:rgba(21, 32, 43, .22);
  --ink:        #15191d;  /* texte principal (15,3:1) */
  --ink-2:      #4a535c;  /* texte secondaire (6,8:1) */
  --ink-3:      #646d76;  /* métadonnées (4,6:1 sur acier) */
  --brass:      #8c5414;  /* action principale (6,2:1 avec blanc) */
  --brass-ink:  #ffffff;
  --brass-soft: #f4e9da;
  --go:         #1f7a3d;  --go-soft:   #e1f1e5;   /* voyant vert : RDV, client */
  --wait:       #2d5f9e;  --wait-soft: #e3ecf7;   /* voyant bleu : relance programmée */
  --stop:       #b0322b;  --stop-soft: #f8e2df;   /* voyant rouge : retard, refus */
  --float: 0 0 0 1px rgba(21,32,43,.08), 0 8px 24px -6px rgba(21,32,43,.18), 0 2px 6px rgba(21,32,43,.06);

  --f-label: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t-cap: 13px; --t-body: 17px; --t-lead: 19px; --t-h2: 22px; --t-h1: 28px; --t-num: 34px;
  --r-ctl: 10px; --r-panel: 14px; --r-sheet: 20px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --dock-h: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --steel: #111417; --panel: #1a1e22; --panel-sunk: #15181b;
    --rule: rgba(255,255,255,.09); --rule-strong: rgba(255,255,255,.18);
    --ink: #e9edf0; --ink-2: #aab3bb; --ink-3: #8a939b;
    --brass: #d9a35f; --brass-ink: #1d1206; --brass-soft: #33281a;
    --go: #76d08f; --go-soft: #18301f; --wait: #8fb6ec; --wait-soft: #1a2638; --stop: #f19a91; --stop-soft: #3a1f1c;
    --float: 0 0 0 1px rgba(255,255,255,.08), 0 10px 30px -8px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --steel: #111417; --panel: #1a1e22; --panel-sunk: #15181b;
  --rule: rgba(255,255,255,.09); --rule-strong: rgba(255,255,255,.18);
  --ink: #e9edf0; --ink-2: #aab3bb; --ink-3: #8a939b;
  --brass: #d9a35f; --brass-ink: #1d1206; --brass-soft: #33281a;
  --go: #76d08f; --go-soft: #18301f; --wait: #8fb6ec; --wait-soft: #1a2638; --stop: #f19a91; --stop-soft: #3a1f1c;
  --float: 0 0 0 1px rgba(255,255,255,.08), 0 10px 30px -8px rgba(0,0,0,.6);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--steel); color: var(--ink);
  font-family: var(--f-body); font-size: var(--t-body); line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
img { max-width: 100%; }
h1, h2, h3 { margin: 0; font-family: var(--f-label); line-height: 1.15; text-wrap: balance; }
h1 { font-size: var(--t-h1); font-weight: 800; letter-spacing: -.015em; font-stretch: 92%; }
h2 { font-size: var(--t-h2); font-weight: 750; letter-spacing: -.01em; font-stretch: 92%; }
p { margin: 0; text-wrap: pretty; }
a { color: var(--brass); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.meta { color: var(--ink-3); font-size: var(--t-cap); }
.sub { color: var(--ink-2); }
.stack { display: flex; flex-direction: column; gap: var(--s3); }
.row { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* étiquette de section : petites capitales façon plaque de machine */
.label {
  font-family: var(--f-label); font-size: var(--t-cap); font-weight: 700; font-stretch: 80%;
  letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin: 0;
}

/* ---------- barre du haut ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--steel); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--steel);
  border-bottom: 1px solid var(--rule);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 720px; margin: 0 auto; min-height: 52px; display: flex; align-items: center; gap: var(--s3); }
.brand { display: flex; align-items: center; gap: var(--s2); min-width: 0; flex: 1; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--ink); color: var(--steel); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 16px; height: 16px; }
.brand-name { font-family: var(--f-label); font-weight: 750; font-stretch: 85%; font-size: 17px; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-tag { font-family: var(--f-label); font-size: 12px; font-weight: 700; font-stretch: 80%; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--rule-strong); color: var(--ink-2); }
.topbar .back { appearance: none; border: 0; background: none; color: var(--brass); font-weight: 700; min-height: 44px; padding: 0 8px 0 0; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.topbar .back svg { width: 22px; height: 22px; }
.topbar .title { font-family: var(--f-label); font-weight: 750; font-stretch: 88%; font-size: 17px; text-align: center; flex: 1; font-variant-numeric: tabular-nums; }
.topbar .end { appearance: none; border: 0; background: none; color: var(--brass); font-weight: 700; min-height: 44px; min-width: 44px; padding: 0 0 0 8px; cursor: pointer; text-align: right; }

main {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: var(--s5) calc(var(--dock-h) + 96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: var(--s6);
}
main.focus-mode { gap: var(--s5); padding-top: var(--s4); }

/* ---------- barre d'onglets ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel);
  border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { appearance: none; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 56px; padding: 7px 4px 8px; color: var(--ink-3); font-size: 12px; font-weight: 700; }
.tab svg { width: 25px; height: 25px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg .fill { fill: currentColor; }
.tab .fill { fill: none; }

/* ---------- boutons ---------- */
.btn {
  appearance: none; cursor: pointer; text-decoration: none; text-align: center;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 48px; padding: 0 var(--s4); border-radius: var(--r-ctl);
  border: 1px solid var(--rule-strong); background: var(--panel); color: var(--ink);
  font-family: var(--f-body); font-weight: 700; font-size: 16px;
  transition: transform .12s var(--ease), background-color .15s;
}
.btn:hover { background: var(--panel-sunk); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--brass); border-color: transparent; color: var(--brass-ink); }
.btn.primary:hover { filter: brightness(1.07); background: var(--brass); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--brass); padding-inline: var(--s2); }
.btn.quiet:hover { background: var(--brass-soft); }
.btn.big { min-height: 60px; font-size: 18px; border-radius: 14px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--stop); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn svg { width: 22px; height: 22px; flex: none; }

/* contrôle segmenté (durée, nombre de visites, départ) */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--panel-sunk); border: 1px solid var(--rule); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { appearance: none; border: 0; background: transparent; min-height: 44px; border-radius: 9px; cursor: pointer; font-family: var(--f-label); font-stretch: 88%; font-weight: 700; font-size: 17px; color: var(--ink-2); font-variant-numeric: tabular-nums; padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--rule-strong), 0 1px 2px rgba(0,0,0,.08); }

/* filtres de liste (défilants) */
.filters { display: flex; gap: var(--s2); overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.filters::-webkit-scrollbar { display: none; }
.filter { appearance: none; flex: none; cursor: pointer; border: 1px solid var(--rule-strong); background: var(--panel); color: var(--ink-2); border-radius: 999px; min-height: 44px; padding: 0 14px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--steel); border-color: var(--ink); }
.filter .n { font-variant-numeric: tabular-nums; font-weight: 400; margin-left: 6px; opacity: .8; }

/* ---------- tampons d'état : forme + mot, jamais la couleur seule ---------- */
.stamp {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font-family: var(--f-label); font-size: 12px; font-weight: 750; font-stretch: 78%; letter-spacing: .07em; text-transform: uppercase;
  padding: 3px 8px 3px 6px; border-radius: 6px; border: 1.5px solid currentColor; color: var(--ink-3); background: transparent;
}
.stamp svg { width: 13px; height: 13px; }
.stamp.go { color: var(--go); background: var(--go-soft); }
.stamp.wait { color: var(--wait); background: var(--wait-soft); }
.stamp.stop { color: var(--stop); background: var(--stop-soft); }
.stamp.new { color: var(--brass); background: var(--brass-soft); }
.stamp.closed { color: var(--ink-3); }

/* ---------- feuille de passage (signature) ---------- */

/* ---------- accueil ---------- */
.greet { display: flex; flex-direction: column; gap: var(--s1); }
.greet h1 { font-size: 32px; }
.launch { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-panel); padding: var(--s5) var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
.launch .q { font-family: var(--f-label); font-size: var(--t-h2); font-weight: 750; font-stretch: 92%; }
.yield { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.yield b { font-family: var(--f-label); font-size: var(--t-num); font-weight: 800; font-stretch: 85%; line-height: 1; font-variant-numeric: tabular-nums; }
.yield span { color: var(--ink-2); }
.agenda { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-panel); overflow: hidden; }
.agenda-row { appearance: none; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: 40px 1fr auto 18px; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); min-height: 64px; border-top: 1px solid var(--rule); width: 100%; }
.agenda-row:first-child { border-top: 0; }
.agenda-row:hover { background: var(--panel-sunk); }
.agenda-row .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-sunk); color: var(--ink-2); }
.agenda-row .ic svg { width: 21px; height: 21px; }
.agenda-row .ic.hot { background: var(--wait-soft); color: var(--wait); }
.agenda-row .t { font-weight: 700; }
.agenda-row .d { color: var(--ink-3); font-size: 15px; display: block; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agenda-row .c { font-family: var(--f-label); font-weight: 800; font-stretch: 85%; font-size: var(--t-h2); font-variant-numeric: tabular-nums; }
.agenda-row .chev { color: var(--ink-3); width: 18px; height: 18px; }
.agenda-row > span:nth-child(2) { min-width: 0; }
.tally { display: flex; gap: var(--s5); flex-wrap: wrap; }
.tally div { display: flex; align-items: baseline; gap: 6px; }
.tally b { font-family: var(--f-label); font-size: var(--t-h2); font-weight: 800; font-stretch: 85%; font-variant-numeric: tabular-nums; }
.tally span { color: var(--ink-2); font-size: 15px; }
.notice { border: 1px solid var(--rule-strong); border-radius: var(--r-ctl); padding: var(--s3) var(--s4); font-size: 15px; color: var(--ink-2); background: var(--panel); }
.notice b { color: var(--ink); }
.err { border: 1.5px solid var(--stop); background: var(--stop-soft); color: var(--stop); border-radius: var(--r-ctl); padding: var(--s3) var(--s4); font-weight: 700; }

/* ---------- liste ---------- */
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--ink-3); pointer-events: none; }
.search input[type=search] { padding-left: 42px; }
.rows { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-panel); overflow: hidden; }
.prow { appearance: none; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s3); padding: var(--s3) var(--s4); border-top: 1px solid var(--rule); min-height: 64px; }
.prow:first-child { border-top: 0; }
.prow:hover { background: var(--panel-sunk); }
.prow .n { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.prow .r { align-self: start; padding-top: 2px; }
.prow .m { grid-column: 1 / -1; color: var(--ink-3); font-size: 15px; display: flex; flex-wrap: wrap; gap: 0 10px; }
.prow .m .late { color: var(--stop); font-weight: 700; }
.score { font-family: var(--f-label); font-weight: 800; font-stretch: 80%; font-variant-numeric: tabular-nums; font-size: 15px; color: var(--ink-2); }
.score small { font-weight: 500; color: var(--ink-3); }
.empty { padding: var(--s5) var(--s4); text-align: center; color: var(--ink-2); }

/* ---------- vue prospect (session, visite, fiche) ---------- */
.p-head { display: flex; flex-direction: column; gap: var(--s2); }
.p-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--ink-3); font-size: 15px; }
.p-kicker .cat { font-family: var(--f-label); font-weight: 700; font-stretch: 80%; letter-spacing: .07em; text-transform: uppercase; font-size: var(--t-cap); color: var(--ink-2); }
.p-head h1 { overflow-wrap: anywhere; }
.p-legal { color: var(--ink-3); font-size: 15px; overflow-wrap: anywhere; }
.askfor { display: flex; gap: var(--s3); align-items: center; padding: var(--s3) 0 0; font-size: var(--t-lead); }
.askfor svg { width: 22px; height: 22px; color: var(--ink-3); flex: none; }
.askfor b { font-weight: 700; }

/* l'action principale : le numéro est le bouton */
.primary-act { display: flex; flex-direction: column; gap: var(--s2); }
.callbar {
  display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: var(--s3);
  min-height: 76px; padding: var(--s3) var(--s4) var(--s3) var(--s3); border-radius: 16px;
  background: var(--brass); color: var(--brass-ink); text-decoration: none;
  transition: transform .12s var(--ease);
}
.callbar:active { transform: scale(.98); }
.callbar .ic { width: 52px; height: 52px; border-radius: 13px; background: rgba(255,255,255,.16); display: grid; place-items: center; }
.callbar .ic svg { width: 26px; height: 26px; }
.callbar .v { min-width: 0; }
.callbar .v b { display: block; font-family: var(--f-label); font-size: clamp(21px, 6.2vw, 26px); font-weight: 800; font-stretch: 85%; font-variant-numeric: tabular-nums; letter-spacing: .01em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.callbar.place .v b { white-space: normal; font-size: 21px; }
.callbar .v small { display: block; font-size: 15px; opacity: .85; }
.callbar .go { font-family: var(--f-label); font-weight: 800; font-stretch: 85%; text-transform: uppercase; letter-spacing: .08em; font-size: 14px; }
@media (max-width: 420px) { .callbar { grid-template-columns: 52px 1fr; } .callbar .go { display: none; } }
.method-why { display: flex; gap: var(--s2); font-size: 15px; color: var(--ink-2); }
.method-why b { color: var(--ink); }
.nophone { border: 1.5px dashed var(--rule-strong); border-radius: 16px; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }

.facts { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.fact { display: grid; grid-template-columns: 24px 1fr auto; gap: var(--s3); align-items: center; padding: var(--s3) 0; border-bottom: 1px solid var(--rule); min-height: 56px; min-width: 0; }
.fact > svg { width: 20px; height: 20px; color: var(--ink-3); }
.fact .v { min-width: 0; overflow-wrap: anywhere; }
.fact .v small { display: block; color: var(--ink-3); font-size: 14px; }
.fact .v a { font-weight: 700; text-decoration: none; }
.fact .acts { display: flex; gap: 2px; }
.fact details summary { cursor: pointer; }

.why { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.why li { display: grid; grid-template-columns: 14px 1fr; gap: var(--s2); font-size: 16px; color: var(--ink-2); }
.why li::before { content: ""; width: 6px; height: 6px; border-radius: 1px; background: var(--brass); margin-top: .62em; }
.why li:first-child { color: var(--ink); font-weight: 700; }

.opener { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-panel); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
.opener p { font-size: var(--t-lead); line-height: 1.45; }
details.more { border-top: 1px solid var(--rule); }
details.more:last-of-type { border-bottom: 1px solid var(--rule); }
details.more > summary { list-style: none; cursor: pointer; min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); font-weight: 700; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg) translateY(-3px); transition: transform .18s var(--ease); flex: none; margin-right: 4px; }
details.more[open] > summary::after { transform: rotate(-135deg) translateY(-2px); }
details.more .body { padding-bottom: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.say { display: flex; flex-direction: column; gap: 2px; }
.say .label { color: var(--brass); }
.obj { display: flex; flex-direction: column; gap: 2px; }
.obj q { font-weight: 700; quotes: "« " " »"; }
.mail { background: var(--panel-sunk); border: 1px solid var(--rule); border-radius: var(--r-ctl); padding: var(--s3) var(--s4); white-space: pre-wrap; font-size: 15px; max-height: 300px; overflow: auto; }

.history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s3); }
.history li { display: grid; grid-template-columns: 84px 1fr; gap: var(--s3); font-size: 15px; }
.history time { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.next { display: flex; align-items: center; gap: var(--s3); font-size: 16px; }

const enc = encodeURIComponent;
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function haversine(a, b) {
  const R = 6371, t = (x) => (x * Math.PI) / 180;
  const s = Math.sin(t(b.lat - a.lat) / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(t(b.lng - a.lng) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function endOfToday() { const d = new Date(); d.setHours(23, 59, 59, 999); return d.toISOString(); }
function startOfWeek() { const d = new Date(); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); d.setHours(0, 0, 0, 0); return d.toISOString(); }
function addDays(n, hour = 9) {
  const d = new Date(); d.setDate(d.getDate() + n);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  d.setHours(hour, 0, 0, 0); return d.toISOString();
}
function addBusinessDays(n, hour = 9) {
  const d = new Date(); let k = 0;
  while (k < n) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) k++; }
  d.setHours(hour, 0, 0, 0); return d.toISOString();
}
function dayDiff(iso) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(iso); b.setHours(0, 0, 0, 0);
  return Math.round((b - a) / 86400000);
}
function fmtDay(iso, withTime = false) {
  if (!iso) return "";
  const d = new Date(iso);
  const s = d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
  if (!withTime) return s;
  return s + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }).replace(":", " h ");
}
function fmtRel(iso) {
  if (!iso) return "";
  const n = dayDiff(iso);
  if (n < -1) return `en retard de ${-n} jours`;
  if (n === -1) return "depuis hier";
  if (n === 0) return "aujourd'hui";
  if (n === 1) return "demain";
  if (n < 7) return fmtDay(iso);
  if (n < 60) return `dans ${n} jours`;
  return `dans ${Math.round(n / 30)} mois`;
}
function hasTime(iso) { const d = new Date(iso); return !(d.getHours() === 9 && d.getMinutes() === 0); }
function km(n) { return n == null ? "" : String(Math.round(n * 10) / 10).replace(".", ",") + " km"; }
function phoneHref(p) { return "tel:" + String(p || "").replace(/[^\d+]/g, ""); }
function cleanSearch(q) { return String(q || "").replace(/[,()*%\\":]/g, " ").replace(/\s+/g, " ").trim(); }

function toast(msg, ms = 2600, undo = null) {
  const t = $("#toast");
  S.undo = undo;
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" data-act="undo">Annuler</button>' : ""}`;
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; S.undo = null; }, undo ? 6000 : ms);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copié"); }
  catch { toast("Copie impossible : sélectionnez le texte à la main"); }
}
function mapsDir(p) {
  if (p.lat != null) return `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
  return `https://www.google.com/maps/search/?api=1&query=${enc((p.name || "") + " " + (p.address || p.city || ""))}`;
}
function googleSearch(p) { return `https://www.google.com/search?q=${enc(`${p.name} ${p.city || ""} téléphone`)}`; }

   3. Méthode conseillée, script d'appel et e-mail

function hcMid(p) { return p.headcount_code && p.headcount_code in HC_MID ? HC_MID[p.headcount_code] : null; }
function phoneOk(p) { return !!p.phone && p.phone_status !== "invalide"; }

function initialChannel(p) {
  const size = hcMid(p);
  if (p.source === "marche_public") return "email";
  if (p.naf === "96.01B") return phoneOk(p) ? "appel" : p.email ? "email" : "visite";
  if (WALKIN.has(p.category) && (size === null || size < 10) && (p.distance_km ?? 99) <= 12) return "visite";
  if (phoneOk(p)) return "appel";
  if (p.email) return "email";
  return "visite";
}
function channelOf(p) { return p.channel || initialChannel(p); }

function channelWhy(p, ch) {
  const size = hcMid(p);
  if (p.status === "rdv") return "Rendez-vous prévu : préparez votre présentation.";
  if ((p.attempts || 0) >= 3 && ch === "visite") return "Plusieurs appels sans réponse : un passage sur place a plus de chances.";
  if ((p.attempts || 0) >= 3 && ch === "email") return "Plusieurs appels sans réponse : un e-mail court peut débloquer la situation.";
  if (ch === "visite") {
    if (!phoneOk(p) && !p.email) return "Aucun téléphone ni e-mail trouvé : le plus simple est de passer.";
    if (WALKIN.has(p.category)) return "Commerce ouvert au public : le patron est souvent sur place, 5 minutes en face à face convainquent mieux qu'un appel.";
    return "Le passage sur place est la meilleure option pour ce prospect.";
  }
  if (ch === "email") return "Pas de numéro fiable : un e-mail court, puis une relance par téléphone ou sur place.";
  if (p.naf === "96.01B") return "Pas de personnel sur place : appelez directement le gérant.";
  if (size != null && size >= 20) return "Site avec une équipe : appelez le standard et demandez la personne qui s'occupe de la salle de pause ou des services généraux.";
  if (p.manager_name) return `Petite structure : demandez directement ${p.manager_name}.`;
  return "Un appel direct est le moyen le plus rapide d'obtenir un rendez-vous.";
}

function pitchOf(p) { return p.naf === "96.01B" ? PITCH.laverie : PITCH[p.category] || PITCH.default; }

function scriptOf(p, s) {
  const me = s.sender || "[votre prénom]";
  const co = s.company || "[votre entreprise]";
  const opener = p.manager_name && (hcMid(p) ?? 0) < 50
    ? `Bonjour, ${me} de ${co}. Je souhaiterais parler à ${p.manager_name}, s'il vous plaît.`
    : `Bonjour, ${me} de ${co}, nous sommes installés à côté de chez vous. Je cherche la personne qui s'occupe du café et de la salle de pause. C'est vous, ou à qui dois-je m'adresser ?`;
  return {
    opener,
    pitch: pitchOf(p),
    offer: s.offer,
    questions: [
      "Combien de personnes passent chez vous chaque jour (salariés et visiteurs) ?",
      "Vous avez déjà une machine aujourd'hui ? Vous en êtes satisfait : pannes, réassort, prix ?",
      "Qui décide pour ce genre d'équipement ?",
    ],
    close: "Le plus simple, c'est que je passe 10 minutes vous montrer ce qu'on propose. Plutôt en début ou en fin de semaine ?",
    objections: [
      ["On a déjà une machine.", "Très bien. Vous en êtes content ? Et le contrat se termine quand ? Je le note et je vous rappelle à ce moment-là."],
      ["On n'a pas la place.", "Il existe des modèles compacts. Je peux passer voir l'emplacement en 5 minutes, sans engagement."],
      ["On est trop petits.", "Pour une petite équipe, une simple machine à café suffit souvent. Je vous montre ce que ça donne ?"],
      ["Envoyez-moi une documentation.", "Avec plaisir. Je l'envoie à quelle adresse ? Et je vous rappelle dans quelques jours pour en parler."],
      ["Ça coûte combien ?", s.offer],
      ["Je n'ai pas le temps.", "Je comprends. Je vous rappelle quand : demain matin ou plutôt en fin de journée ?"],
    ],
  };
}

function emailOf(p, s) {
  const subjects = {
    attente: "Un distributeur pour vos clients qui attendent",
    sport: "Boissons et en-cas pour vos adhérents",
    sante: "Boissons et en-cas à toute heure pour vos équipes et vos visiteurs",
    hotel: "Boissons et en-cas pour vos clients, à toute heure",
  };
  const subject = subjects[p.category] || `Un coin café pour vos équipes à ${p.city || "votre site"}`;
  const where = s.center?.label ? ` autour de ${s.center.label}` : "";
  const body = [
    "Bonjour,",
    "",
    `Je suis ${s.sender || "[votre prénom]"}, de ${s.company || "[votre entreprise]"}. Nous installons et gérons des distributeurs automatiques (café, boissons fraîches, en-cas) dans les entreprises${where}.`,
    "",
    pitchOf(p),
    s.offer,
    "",
    `Est-ce que je peux passer 10 minutes vous présenter ce que nous proposons ? Dites-moi le moment qui vous arrange${s.phone ? `, ou appelez-moi au ${s.phone}` : ""}.`,

    s.sender || "[votre prénom]",

  return { subject, body, href: `mailto:${p.email || ""}?subject=${enc(subject)}&body=${enc(body)}` };
}

const FINAL_IN = "(" + FINAL.join(",") + ")";
function chk(res) { if (res.error) throw new Error(res.error.message); return res.count ?? res.data; }

function remoteApi() {
  const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  return {
    async me() { const { data } = await sb.auth.getSession(); return data.session?.user ?? null; },
    async login(email, password) {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(/invalid/i.test(error.message) ? "E-mail ou mot de passe incorrect." : error.message);
      return data.user;
    },
    async logout() { await sb.auth.signOut(); },
    async setPassword(password) { const { error } = await sb.auth.updateUser({ password }); if (error) throw new Error(error.message); },
    async sendReset(email) { const { error } = await sb.auth.resetPasswordForEmail(email); if (error) throw new Error(error.message); },
    onRecovery(cb) { sb.auth.onAuthStateChange((ev) => { if (ev === "PASSWORD_RECOVERY") cb(); }); },
    async getSettings() { const row = chk(await sb.from("settings").select("value").eq("key", "main").maybeSingle()); return row?.value || {}; },
    async saveSettings(v) { chk(await sb.from("settings").upsert({ key: "main", value: v })); },
    async count(status) {
      let q = sb.from("prospects").select("id", { count: "exact", head: true });
      if (status && status !== "tous") q = q.eq("status", status);
      return (await q).count || 0;
    },
    async due(endIso) { return chk(await sb.from("prospects").select("*").lte("next_action_at", endIso).not("status", "in", FINAL_IN).order("next_action_at").limit(300)); },
    async fresh(limit, exclude, mode) {
      let q = sb.from("prospects").select("*").eq("status", "nouveau").is("next_action_at", null).order("score", { ascending: false }).limit(limit);
      if (mode === "remote") q = q.or("channel.is.null,channel.eq.appel,channel.eq.email");
      if (mode === "visite") q = q.or("channel.eq.visite,and(channel.is.null,category.in.(attente,sport,hotel))");
      if (mode === "visite_phone") q = q.eq("channel", "visite").not("phone", "is", null);
      if (exclude.length) q = q.not("id", "in", "(" + exclude.join(",") + ")");
      return chk(await q);
    },
    async list(status, q, limit = 60) {
      let x = sb.from("prospects").select("*").limit(limit);
      if (status && status !== "tous") x = x.eq("status", status);
      const term = cleanSearch(q);
      if (term) x = x.or(`name.ilike.*${term}*,legal_name.ilike.*${term}*,city.ilike.*${term}*,phone.ilike.*${term}*`);
      if (status === "nouveau") x = x.order("score", { ascending: false });
      else if (status === "client") x = x.order("updated_at", { ascending: false });
      else x = x.order("next_action_at", { ascending: true, nullsFirst: false }).order("updated_at", { ascending: false });
      return chk(await x);
    },
    async get(id) { return chk(await sb.from("prospects").select("*").eq("id", id).single()); },
    async update(id, patch) { return chk(await sb.from("prospects").update(patch).eq("id", id).select().single()); },
    async insert(row) { return chk(await sb.from("prospects").insert(row).select().single()); },
    async findDuplicate(name, phone) {
      const term = cleanSearch(name);
      const ors = [];
      if (term) ors.push(`name.ilike."${term}"`, `legal_name.ilike."${term}"`);
      if (phone) ors.push(`phone.eq."${cleanSearch(phone)}"`);
      if (!ors.length) return null;
      const rows = chk(await sb.from("prospects").select("id,name,city,status").or(ors.join(",")).limit(1));
      return rows[0] || null;
    },
    async log(row) { return chk(await sb.from("interactions").insert(row).select("id").single()); },
    async unlog(id) { chk(await sb.from("interactions").delete().eq("id", id)); },
    async history(pid) { return chk(await sb.from("interactions").select("*").eq("prospect_id", pid).order("at", { ascending: false }).limit(60)); },
    async activitySince(iso) { return chk(await sb.from("interactions").select("kind,outcome,at").gte("at", iso).limit(3000)); },
    async tenders() { return chk(await sb.from("prospects").select("*").eq("source", "marche_public").not("status", "in", FINAL_IN).order("next_action_at").limit(5)); },
    async upcomingRdv() { return chk(await sb.from("prospects").select("*").eq("status", "rdv").order("next_action_at").limit(10)); },
    async exportAll() {
      const out = [];
      for (let from = 0; from < 20000; from += 1000) {
        const rows = chk(await sb.from("prospects").select("*").order("score", { ascending: false }).range(from, from + 999));
        out.push(...rows);
        if (rows.length < 1000) break;
      }
      return out;
    },
    async fn(action, body = {}) {
      const { data, error } = await sb.functions.invoke("prospects", { body: { action, ...body } });
      if (error) {
        let msg = error.message;
        try { const j = await error.context.json(); if (j?.error) msg = j.error; } catch (_) { /* rien */ }
        throw new Error(msg);
      }
      if (data?.error) throw new Error(data.error);
      return data;
    },
  };
}

function mergeSettings(v) {

}

function perContact() { return Math.max(2, Number(S.settings?.minutesPerContact) || 4); }
function contactsFor(minutes) { return Math.max(2, Math.round(minutes / perContact())); }

function setNav() {
  const v = S.view === "fiche" ? (S.backTo || "list") : S.view;
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-current", t.dataset.v === v ? "page" : "false"));
}

function render() {
  const v = $("#view");
  const views = { setpass: vSetPass, login: vLogin, home: vHome, session: vSession, visit: vVisit, list: vList, fiche: vFiche, tour: vTour, settings: vSettings };
  // garder ce qui est en cours de saisie quand le même écran se redessine
  const a = document.activeElement;
  const keep = a && a.id && v.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)
    ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  const typed = {};
  if (render.lastView === S.view && !render.reset) {
    v.querySelectorAll("input[id], textarea[id], select[id]").forEach((el) => {
      if (el.dataset.typed) typed[el.id] = el.type === "checkbox" ? el.checked : el.value;
    });
  }
  render.lastView = S.view; render.reset = false;

  $("#topbar").innerHTML = topbarHTML();
  v.className = FOCUS.has(S.view) || S.view === "fiche" ? "focus-mode" : "";
  v.innerHTML = (views[S.view] || vHome)();
  const dock = $("#dock");
  const d = dockFor();
  dock.innerHTML = d; dock.hidden = !d;
  $("#tabbar").hidden = S.view === "login" || S.view === "setpass" || FOCUS.has(S.view);
  setNav();
  requestAnimationFrame(() => {
    const h = dock.hidden ? 0 : dock.offsetHeight - 80;
    document.documentElement.style.setProperty("--dock-h", h + "px");
  });

  for (const [id, val] of Object.entries(typed)) {
    const el = document.getElementById(id);
    if (!el) continue;
    if (el.type === "checkbox") el.checked = val; else el.value = val;
    el.dataset.typed = "1";
  }
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) { el.focus(); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (_) { /* champ sans curseur */ } }
  }
}

function go(view, opts = {}) {
  S.view = view; S.ctx = {};
  if (opts.backTo) S.backTo = opts.backTo;
  closeSheet();
  window.scrollTo(0, 0);
  render();
  const loaders = { home: loadHome, list: loadList, settings: loadSettingsView };
  loaders[view]?.();
}

function progressHTML(done, total, label, counts = []) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  const parts = counts.filter(([n]) => n > 0).map(([n, one, many, tone]) => `<span class="pc ${tone || ""}"><b class="num">${n}</b> ${n > 1 ? many : one}</span>`);
  return `<div class="progress">
    <div class="pg-top"><span><b class="num">${done}</b> ${esc(label)} sur <b class="num">${total}</b></span>${parts.length ? `<span class="pg-counts">${parts.join("")}</span>` : ""}</div>
    <div class="meter" role="progressbar" aria-label="Avancement" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><i style="width:${pct}%"></i></div>
  </div>`;
}
function sessionCounts(res) {
  const r = res.filter((x) => x && !x.skip);

    [r.filter((x) => x.outcome === "RDV pris" || x.outcome === "Signé").length, "rendez-vous", "rendez-vous", "go"],

  const reasons = Array.isArray(p.score_reasons) ? p.score_reasons : [];

  const pos = reasons.filter((r) => !/^Attention/.test(r)), neg = reasons.filter((r) => /^Attention/.test(r));
  const bars = parts ? `<details class="more"${where === "fiche" ? " open" : ""}><summary>Détail de la note ${p.score ?? ""}/100</summary><div class="body"><ul class="bars">${PARTS.map(([k, t, d]) => {

async function loadHome() {
  const gen = ++renderGen;
  try {
    const [due, rdv, act, total, freshAll, tenders] = await Promise.all([api.due(endOfToday()), api.upcomingRdv(), api.activitySince(startOfWeek()), api.count(), api.fresh(20, [], "remote"), api.tenders()]);
    const fresh = freshAll.filter((p) => p.channel || !(WALKIN.has(p.category) && p.naf !== "96.01B"));
    if (gen !== renderGen || S.view !== "home") return;
    const remote = due.filter((p) => p.status !== "rdv" && channelOf(p) !== "visite" && p.source !== "marche_public");
    const visits = due.filter((p) => p.status !== "rdv" && channelOf(p) === "visite");
    const contacts = act.filter((a) => ["appel", "visite", "email"].includes(a.kind)).length;
    const rdvWeek = act.filter((a) => a.outcome === "RDV pris").length;
    const won = act.filter((a) => a.outcome === "Signé").length;
    S.home = { remote, visits, rdv, contacts, rdvWeek, won, total, fresh, tenders };
  } catch (e) { S.home = { error: e.message }; }
  if (!loadHome.tendersTried) { loadHome.tendersTried = true; refreshTenders().then((added) => { if (added && S.view === "home") loadHome(); }); }
  if (S.view === "home") render();
}

/* =====================================================================
   9. Recherche d'entreprises (remplissage de la base)
   ===================================================================== */
const centerKey = (s) => `${s.center.lat},${s.center.lng},${s.radius}`;

// Carte des commerces de bouche autour du point de départ (une fois par zone)
async function ensureMap(onProgress) {
  const s = S.settings;
  if (s.osm?.key === centerKey(s)) return false;
  S.harvesting = { label: "Carte des cafés et commerces autour de vous", group: 0, groups: 1 };
  onProgress?.(S.harvesting);
  const r = await api.fn("osm", { center: { lat: s.center.lat, lng: s.center.lng }, radius: s.radius });
  s.osm = { key: centerKey(s), at: new Date().toISOString(), count: r.count };
  await api.saveSettings(s);
  return true;
}

// Appels d'offres publics : vérifiés au plus une fois par jour, sans bloquer
async function refreshTenders() {
  const s = S.settings;
  if (s.tenders?.at && dayDiff(s.tenders.at) === 0) return false;
  try {
    const r = await api.fn("tenders", { departements: [s.departement || "34"] });
    s.tenders = { at: new Date().toISOString(), found: r.found };
    await api.saveSettings(s);
    return (r.inserted || 0) > 0;
  } catch (_) { return false; /* source indisponible : on réessaiera */ }
}

// Recalcule toutes les notes avec la carte, les clients et les résultats
async function rescoreAll(onProgress) {
  let cursor = null, n = 0;
  do {
    S.harvesting = { label: `Recalcul des notes (${n} prospects)`, group: 0, groups: 1 };
    onProgress?.(S.harvesting);
    const r = await api.fn("rescore", { cursor });
    n += r.updated || 0; cursor = r.cursor;
  } while (cursor);
  S.settings.rescored_at = new Date().toISOString();
  await api.saveSettings(S.settings);
  S.harvesting = null;
  return n;
}

// Mise à jour complète : carte → registre → marchés publics → notes
async function fullUpdate(onProgress) {
  let mapChanged = false, mapError = null;
  try { mapChanged = await ensureMap(onProgress); } catch (e) { mapError = e.message; }
  const n = await runHarvest({ onProgress });
  await refreshTenders();
  if (mapChanged) await rescoreAll(onProgress);
  S.harvesting = null;
  S.mapError = mapError;
  return n;
}

async function runHarvest({ untilPool = 0, onProgress } = {}) {
  const s = S.settings;
  S.harvesting = { label: "Démarrage", group: 0, groups: 21 };
  onProgress?.(S.harvesting, 0);
  let cursor = s.harvest?.cursor ?? null;
  const restart = !cursor || s.harvest?.center_key !== `${s.center.lat},${s.center.lng},${s.radius}`;
  if (restart) cursor = { g: 0, page: 1 };
  let inserted = 0;
  while (cursor) {
    const res = await api.fn("harvest", { cursor, center: { lat: s.center.lat, lng: s.center.lng }, radius: s.radius });
    inserted += res.inserted || 0;
    cursor = res.cursor;
    S.harvesting = res.progress;
    onProgress?.(res.progress, inserted);
    s.harvest = { cursor, center_key: `${s.center.lat},${s.center.lng},${s.radius}`, done_at: cursor ? s.harvest?.done_at || null : new Date().toISOString() };
    await api.saveSettings(s);
    if (untilPool && cursor) {
      const pool = await api.fresh(untilPool, [], "remote");
      if (pool.length >= untilPool) break;
    }
  }
  S.harvesting = null;
  return inserted;
}

/* =====================================================================
   10. Session d'appels
   ===================================================================== */
async function startSession() {
  const n = contactsFor(S.minutes);
  S.session = { minutes: S.minutes, n, queue: [], i: 0, res: [], loading: true, step: 0, startedAt: Date.now(), msg: "" };
  S.backTo = "home";
  go("session", { backTo: "home" });
  const step = (k, msg) => { S.session.step = k; if (msg) S.session.msg = msg; if (S.view === "session") render(); };
  try {
    step(0);
    const due = (await api.due(endOfToday())).filter((p) => p.status !== "rdv" && channelOf(p) !== "visite" && p.source !== "marche_public").slice(0, n);
    const queue = [...due];
    const exclude = queue.map((p) => p.id);
    step(1);
    let pool = await api.fresh(n * 3, exclude, "remote");
    const h = S.settings.harvest;
    const stale = !h?.done_at || h.cursor || dayDiff(h.done_at) < -30;
    if (pool.length < n * 2 && stale) {
      step(1, "Lecture de la carte des commerces autour de vous…");
      try { await ensureMap(); } catch (_) { /* la carte est un bonus : la session continue sans elle */ }
      step(1, "Recherche de nouvelles entreprises dans le registre officiel…");
      await runHarvest({ untilPool: n * 3, onProgress: (pr) => step(1, `Recherche dans le registre : ${pr.label}…`) });
      pool = await api.fresh(n * 3, exclude, "remote");
    }
    step(2, "");
    let rounds = 0;
    while (queue.length < n && pool.length && rounds < 5) {
      rounds++;
      // les commerces à visiter n'ont pas besoin de recherche Google ici : ils partent en tournée
      const walk = pool.filter((p) => !p.channel && initialChannel(p) === "visite" && WALKIN.has(p.category) && p.naf !== "96.01B");
      for (const p of walk) { await api.update(p.id, { channel: "visite" }); exclude.push(p.id); }
      pool = pool.filter((p) => !walk.includes(p));
      if (!pool.length) { pool = await api.fresh(n * 2, exclude, "remote"); continue; }
      const need = n - queue.length;
      const batch = pool.splice(0, Math.min(8, need + 2));
      const toEnrich = batch.filter((p) => !p.enriched_at).map((p) => p.id);
      let enriched = batch;
      if (toEnrich.length) {
        const res = await api.fn("enrich", { ids: toEnrich });
        const byId = Object.fromEntries((res.prospects || []).map((p) => [p.id, p]));
        enriched = batch.map((p) => byId[p.id] || p);
        if (res.google === false) S.googleOn = false;
      }
      for (const p of enriched) {
        if (p.status === "ferme") continue;
        const ch = initialChannel(p);
        if (p.channel !== ch) { await api.update(p.id, { channel: ch }); p.channel = ch; }
        if (ch !== "visite" && queue.length < n) queue.push(p);
        exclude.push(p.id);
      }
      if (!pool.length && queue.length < n) pool = await api.fresh(n * 2, exclude, "remote");
    }
    if (queue.length < n) {
      const extra = await api.fresh(n - queue.length, exclude, "visite_phone");
      for (const p of extra) { p._phoneInstead = true; queue.push(p); }
    }
    S.session.queue = queue;
    S.session.loading = false;
  } catch (e) {
    S.session.loading = false;
    S.session.error = e.message;
  }
  if (S.view === "session") { render(); prefetchHistory(); }
}

  const s = S.session;

  if (s.loading) {
    const steps = ["Relances prévues aujourd'hui", "Sélection des meilleurs prospects", "Recherche des téléphones et e-mails"];

/* =====================================================================
   11. Vue prospect (session, visite, fiche) et barre de résultats
   ===================================================================== */
function ctxOf(p, where) {
  if (where === "visit") return "visite";
  if (where === "fiche" && S.ctx[p.id]) return S.ctx[p.id];
  if (p.status === "rdv") return "rdv";
  const ch = channelOf(p);
  if (where === "session" && ch === "visite") return "appel";
  return ch;
}

function primaryAct(p, ctx) {
  const why = (label, text) => `<p class="method-why"><span><b>${label}</b> ${esc(text)}</span></p>`;
  const bar = (href, icon, value, small, go, ext) => `
    <a class="callbar" href="${esc(href)}"${ext ? ' target="_blank" rel="noopener"' : ""}>
      <span class="ic">${icon}</span><span class="v"><b>${esc(value)}</b>${small ? `<small>${esc(small)}</small>` : ""}</span><span class="go">${go}</span>
    </a>`;
  if (p.source === "marche_public" && p.website) {
    return `<div class="primary-act">${bar(p.website, ICON.globe, "Voir l'appel d'offres", p.next_action_at ? `À préparer avant le ${fmtDay(p.next_action_at)}` : "Dossier en ligne", "Ouvrir", true)}${why("Marché public :", "l'acheteur cherche déjà un prestataire. Téléchargez le dossier et répondez dans les délais.")}</div>`;
  }
  if (ctx === "email") {
    const m = emailOf(p, S.settings);
    return `<div class="primary-act">${p.email ? bar(m.href, ICON.mail, p.email, "E-mail prêt à envoyer", "Ouvrir") : noContact(p, "email")}${why("E-mail :", channelWhy(p, "email"))}</div>`;
  }
  if (ctx === "visite") {
    return `<div class="primary-act">${bar(mapsDir(p), ICON.pin, "Itinéraire", p.address || p.city || "", "Y aller", true)}${why("Visite :", channelWhy(p, "visite"))}</div>`;
  }
  const rdv = ctx === "rdv";
  const body = phoneOk(p) ? bar(phoneHref(p.phone), ICON.phone, p.phone, rdv ? `RDV ${fmtDay(p.next_action_at, true)}` : "Toucher pour appeler", "Appeler") : noContact(p, "phone");
  let text = channelWhy(p, "appel");
  if (p._phoneInstead) text = "Idéalement à visiter, mais un appel peut suffire pour obtenir un rendez-vous.";
  return `<div class="primary-act">${body}${rdv ? "" : why("Appel :", text)}</div>`;
}

function noContact(p, kind) {
  const id = esc(p.id);
  if (kind === "email") return `<div class="nophone"><p><b>Pas d'adresse e-mail.</b> Ajoutez-la depuis la fiche, ou copiez le texte ci-dessous.</p></div>`;
  return `<div class="nophone">
    <p><b>${p.phone_status === "invalide" ? "Numéro invalide." : p.enriched_at ? "Numéro introuvable." : "Numéro pas encore recherché."}</b> Cherchez-le, puis enregistrez-le ici.</p>
    <a class="btn block" href="${esc(googleSearch(p))}" target="_blank" rel="noopener">${ICON.search}Chercher le numéro</a>
    <div class="row" style="flex-wrap:nowrap"><label class="sr" for="phone-${id}">Numéro de téléphone</label><input type="tel" id="phone-${id}" inputmode="tel" placeholder="04 67 …" style="flex:1;min-width:0"><button class="btn primary" data-act="savePhone" data-id="${id}">Enregistrer</button></div>
  </div>`;
}

function factsHTML(p, ctx) {
  const rows = [];
  const copyBtn = (v, what) => `<button class="btn quiet" data-act="copy" data-v="${esc(v)}" aria-label="Copier ${what}">${ICON.copy}</button>`;
  if (ctx !== "appel" && ctx !== "rdv" && phoneOk(p)) rows.push(`<div class="fact">${ICON.phone}<div class="v"><a href="${esc(phoneHref(p.phone))}">${esc(p.phone)}</a></div><div class="acts">${copyBtn(p.phone, "le numéro")}</div></div>`);
  if (p.email && ctx !== "email") rows.push(`<div class="fact">${ICON.mail}<div class="v"><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></div><div class="acts">${copyBtn(p.email, "l'adresse e-mail")}</div></div>`);
  if (ctx !== "visite") rows.push(`<div class="fact">${ICON.pin}<div class="v">${esc(p.address || p.city || "Adresse inconnue")}${p.distance_km != null ? `<small>${esc(km(p.distance_km))} du point de départ</small>` : ""}</div><div class="acts"><a class="btn quiet" href="${esc(mapsDir(p))}" target="_blank" rel="noopener">Itinéraire</a></div></div>`);
  if (p.website || p.maps_url) {
    rows.push(`<div class="fact">${ICON.globe}<div class="v">${p.website ? `<a href="${esc(p.website)}" target="_blank" rel="noopener">Site web</a>` : ""}${p.website && p.maps_url ? " · " : ""}${p.maps_url ? `<a href="${esc(p.maps_url)}" target="_blank" rel="noopener">Fiche Google</a>` : ""}${p.rating ? `<small>Note Google ${esc(String(p.rating).replace(".", ","))} / 5 · ${esc(p.rating_count || 0)} avis</small>` : ""}</div><div></div></div>`);
  }
  if (Array.isArray(p.opening_hours) && p.opening_hours.length) {
    const idx = (new Date().getDay() + 6) % 7;
    const today = (p.opening_hours[idx] || "").replace(/^[^:]+:\s*/, "");
    rows.push(`<div class="fact">${ICON.clock}<div class="v"><details><summary>Aujourd'hui : ${esc(today)}</summary><p class="meta" style="margin-top:6px">${p.opening_hours.map(esc).join("<br>")}</p></details></div><div></div></div>`);
  }
  return rows.length ? `<div class="facts">${rows.join("")}</div>` : "";
}

function scriptHTML(p, ctx) {
  const s = S.settings;
  if (ctx === "email") {
    const m = emailOf(p, s);
    return `<details class="more" open><summary>Texte de l'e-mail</summary><div class="body">
      <div class="mail"><b>Objet : ${esc(m.subject)}</b>\n\n${esc(m.body)}</div>
      <button class="btn" data-act="copyMail" data-id="${esc(p.id)}">${ICON.copy}Copier le texte</button>
    </div></details>`;
  }
  const sc = scriptOf(p, s);
  const opener = ctx === "visite"
    ? `Bonjour, ${s.sender || "[votre prénom]"} de ${s.company || "[votre entreprise]"}. Je passais dans le quartier : qui s'occupe du café et de la salle de pause ici ?`
    : sc.opener;
  return `
  <section class="opener" aria-label="Phrase d'accroche"><p class="label">${ctx === "visite" ? "En arrivant" : "Au téléphone"}</p><p>${esc(opener)}</p></section>
  <div>
    <details class="more"><summary>Suite du script</summary><div class="body">
      <div class="say"><span class="label">Pourquoi chez vous</span><span>${esc(sc.pitch)}</span></div>
      <div class="say"><span class="label">L'offre</span><span>${esc(sc.offer)}</span></div>
      <div class="say"><span class="label">Questions à poser</span><span>${sc.questions.map(esc).join("<br>")}</span></div>
      <div class="say"><span class="label">Pour conclure</span><span>${esc(sc.close)}</span></div>
    </div></details>
    <details class="more"><summary>Si on me répond…</summary><div class="body">
      ${sc.objections.map(([q, a]) => `<div class="obj"><q>${esc(q)}</q><span class="sub">${esc(a)}</span></div>`).join("")}

    ${primaryAct(p, ctx)}

    ${where === "fiche" ? `<section class="stack" style="gap:8px"><h2 class="label">Enregistrer un résultat</h2><div class="inline-oc">${allOutcomes(ctx).map((oid) => ocButton(p, oid, ctx)).join("")}</div></section>` : ""}

/* Résultats regroupés par fréquence : les deux plus courants en grand, puis les autres */
const DOCK = {
  appel:  { main: ["pas_reponse", "rdv"], sub: ["rappel", "equipe", "pas_interesse"], more: ["mauvais_numero", "mail", "signe"] },
  email:  { main: ["mail", "rdv"], sub: ["rappel", "pas_interesse"], more: ["signe"] },
  visite: { main: ["absent", "rdv"], sub: ["plaquette", "equipe", "pas_interesse"], more: ["ferme", "signe"] },
  rdv:    { main: ["signe", "rdv_fait"], sub: ["rdv_reporte", "pas_interesse"], more: [] },
};
const OC_ICON = { rdv: "check", signe: "star", pas_reponse: "redo", absent: "redo", rappel: "clock", rdv_reporte: "cal", rdv_fait: "redo", mail: "mail", plaquette: "mail", equipe: "minus", pas_interesse: "x", mauvais_numero: "phone", ferme: "minus" };
const OC_SHORT = { rdv: "RDV pris", signe: "Signé", rappel: "Rappeler", equipe: "Déjà équipé", pas_interesse: "Pas intéressé", plaquette: "Plaquette", rdv_fait: "Proposition à suivre", rdv_reporte: "Reporté" };
function ocLabel(oid, ctx, short) { if (oid === "mail" && ctx === "appel") return "Doc envoyée par e-mail"; return (short && OC_SHORT[oid]) || OUT[oid].label; }
function allOutcomes(ctx) { const d = DOCK[ctx] || DOCK.appel; return [...d.main, ...d.sub, ...d.more]; }
function ocButton(p, oid, ctx, short) {
  const o = OUT[oid];
  const cls = ["rdv", "signe"].includes(oid) ? "go" : oid === "pas_interesse" ? "neg" : "";
  return `<button class="oc ${cls}" data-act="outcome" data-id="${esc(p.id)}" data-v="${oid}" data-ctx="${ctx}">${ICON[OC_ICON[oid]] || ""}${esc(ocLabel(oid, ctx, short))}</button>`;
}
function dockFor() {
  let p = null, where = null;
  if (S.view === "session" && S.session && !S.session.loading && S.session.queue?.[S.session.i]) { p = S.session.queue[S.session.i]; where = "session"; }
  if (S.view === "visit" && S.tour?.current) { p = S.tour.stops.find((x) => x.id === S.tour.current); where = "visit"; }
  if (!p) return "";
  const ctx = ctxOf(p, where);
  const d = DOCK[ctx] || DOCK.appel;
  return `<div class="dock-in" role="group" aria-label="Résultat du contact">
    <p class="label">Résultat</p>
    <div class="dock-main">${d.main.map((oid) => ocButton(p, oid, ctx, true)).join("")}</div>
    <div class="dock-sub">${d.sub.map((oid) => ocButton(p, oid, ctx, true)).join("")}${d.more.length || where === "session" ? `<button class="oc more" data-act="more" data-id="${esc(p.id)}" data-ctx="${ctx}" aria-label="Autres résultats">${ICON.dots}</button>` : ""}</div>
  </div>`;
}

/* ---------- feuille du bas (dialog natif) ---------- */
function openSheet(html) {
  const d = $("#sheet");
  d.innerHTML = `<div class="sheet-in"><div class="grabber" aria-hidden="true"></div>${html}</div>`;
  if (!d.open) { try { d.showModal(); } catch (_) { d.setAttribute("open", ""); } }
  setTimeout(() => d.querySelector("[autofocus]")?.focus(), 30);
}
function closeSheet() { const d = $("#sheet"); if (d?.open) d.close(); }

function askSheet(pid, oid, ctx) {
  const o = OUT[oid];
  let inner = "";
  if (o.ask === ASK_DATE) {
    inner = `<p class="label">Quand ?</p>
      <div class="quick">${[[1, "Demain"], [3, "Dans 3 jours"], [7, "Dans 1 semaine"], [14, "Dans 2 semaines"], [30, "Dans 1 mois"]].map(([d, l]) => `<button data-act="askDays" data-v="${d}" aria-pressed="${d === 1}">${l}</button>`).join("")}</div>
      <label class="field" for="ask-date">Ou une date précise<input type="date" id="ask-date" value="${addDays(1).slice(0, 10)}"></label>`;
  } else if (o.ask === ASK_DT) {
    const d = new Date(addBusinessDays(1, 10));
    const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    inner = `<label class="field" for="ask-dt">Date et heure<input type="datetime-local" id="ask-dt" value="${local}" autofocus></label>`;
  }
  openSheet(`<h2 id="sheet-title">${esc(ocLabel(oid, ctx))}</h2>${inner}

    <button class="btn quiet block" data-act="closeSheet">Annuler</button>`);
}
function moreSheet(pid, ctx) {
  const p = findLocal(pid);
  const d = DOCK[ctx] || DOCK.appel;
  openSheet(`<h2 id="sheet-title">Autre résultat</h2>
    <div class="sheet-list">${d.more.map((oid) => ocButton(p, oid, ctx)).join("")}
    ${S.view === "session" ? `<button class="oc" data-act="skip">${ICON.chev}Passer ce contact sans rien noter</button>` : ""}</div>
    <button class="btn quiet block" data-act="closeSheet">Annuler</button>`);
}

function findLocal(id) {
  if (S.session?.queue) { const p = S.session.queue.find((x) => x.id === id); if (p) return p; }
  if (S.fiche?.id === id) return S.fiche;
  if (S.tour?.stops) { const p = S.tour.stops.find((x) => x.id === id); if (p) return p; }
  return null;
}

function readAsk(o) {
  if (o.ask === ASK_DATE) {
    const v = $("#ask-date")?.value;
    if (!v) throw new Error("Choisissez une date.");
    const [y, m, d] = v.split("-").map(Number);
    return { date: new Date(y, m - 1, d, 9, 0).toISOString() };
  }
  if (o.ask === ASK_DT) {
    const v = $("#ask-dt")?.value;
    if (!v) throw new Error("Indiquez la date et l'heure du rendez-vous.");
    return { date: new Date(v).toISOString() };
  }
  return {};
}

const UNDO_KEYS = ["status", "next_action", "next_action_at", "attempts", "channel", "phone_status", "last_contact_at", "competitor"];

async function saveOutcome(pid, oid) {
  const p = findLocal(pid);
  if (!p) return;
  const o = OUT[oid];
  let input;
  try { input = readAsk(o); } catch (e) { toast(e.message); return; }
  const where = S.view;
  const ctx = ctxOf(p, where);
  const note = ($(`#note-${CSS.escape(pid)}`)?.value || "").trim();
  const { patch, log, detail } = o.apply(p, input, S.settings, ctx);
  patch.last_contact_at = new Date().toISOString();
  const prev = Object.fromEntries(UNDO_KEYS.map((k) => [k, p[k] ?? null]));
  try {
    const upd = await api.update(pid, patch);
    const logged = await api.log({ prospect_id: pid, kind: ctx, outcome: log, note: [detail, note].filter(Boolean).join(" · ") || null });
    Object.assign(p, upd);
    closeSheet();
    S.list.counts = null;
    render.reset = true;
    if (S.notes) delete S.notes[pid];
    delete S.ctx[pid];
    const next = upd.next_action_at ? `${upd.next_action} ${fmtRel(upd.next_action_at)}` : "";
    const undo = { pid, prev, logId: logged?.id, where, index: S.session?.i };
    toast(oid === "signe" ? "Nouveau client enregistré" : `${log}${next ? " · " + next : " · clôturé"}`, 6000, undo);
    if (where === "session") {
      S.session.res[S.session.i] = { name: p.name, outcome: log, next, tone: toneOf(upd.status), status: upd.status };
      S.session.i++;
      window.scrollTo(0, 0);
      render();
      prefetchHistory();
    } else if (where === "visit") {
      p._done = log; p._tone = toneOf(upd.status);
      S.tour.current = null; S.view = "tour";
      window.scrollTo(0, 0); render();
    } else if (where === "fiche") {
      await openFiche(pid, true);
    }
  } catch (e) { toast("Erreur : " + e.message, 4000); }
}

async function undoOutcome(u) {
  try {
    const upd = await api.update(u.pid, u.prev);
    if (u.logId) await api.unlog(u.logId);
    const p = findLocal(u.pid); if (p) Object.assign(p, upd);
    if (u.where === "session" && S.session) {
      S.session.i = u.index; delete S.session.res[u.index];
      S.view = "session";
    } else if (u.where === "visit" && p) {
      p._done = null; p._tone = null;
    } else if (u.where === "fiche") {
      await openFiche(u.pid, true);
    }
    S.list.counts = null;
    toast("Résultat annulé");
    render();
  } catch (e) { toast("Annulation impossible : " + e.message, 4000); }
}

async function prefetchHistory() {
  const p = S.session?.queue?.[S.session.i];
  if (!p || p._history) return;
  try { p._history = await api.history(p.id); if (S.view === "session" && S.session.queue[S.session.i] === p) render(); } catch (_) { /* facultatif */ }
}

async function openFiche(id, keepScroll = false) {
  const back = S.view === "fiche" ? S.backTo : S.view === "session" ? "home" : S.view;
  S.backTo = back === "fiche" ? "list" : back;
  if (!keepScroll) { S.fiche = null; S.view = "fiche"; window.scrollTo(0, 0); render(); }
  try {
    const [p, h] = await Promise.all([api.get(id), api.history(id)]);
    p._history = h;
    S.fiche = p;
  } catch (e) { S.fiche = { _error: e.message }; }
  S.view = "fiche";
  render();
}

function vFiche() {
  const p = S.fiche;
  if (!p) return loadingBlock();
  if (p._error) return errorBlock(p._error);
  const nextLocal = p.next_action_at ? new Date(new Date(p.next_action_at).getTime() - new Date(p.next_action_at).getTimezoneOffset() * 60000).toISOString().slice(0, 10) : "";
  return `${focusHTML(p, "fiche")}
  <details class="more"><summary>Modifier la fiche</summary><div class="body">
    <div class="grid2">
      <label class="field" for="ed-phone">Téléphone<input type="tel" id="ed-phone" inputmode="tel" value="${esc(p.phone || "")}"></label>
      <label class="field" for="ed-email">E-mail<input type="email" id="ed-email" inputmode="email" value="${esc(p.email || "")}"></label>

}

async function loadList() {
  const gen = ++renderGen;
  const L = S.list;
  try {
    const [rows, counts] = await Promise.all([
      api.list(L.status, L.q),
      L.counts ? Promise.resolve(L.counts) : Promise.all(LIST_FILTERS.map(([k]) => api.count(k))).then((a) => Object.fromEntries(LIST_FILTERS.map(([k], i) => [k, a[i]]))),
    ]);
    if (gen !== renderGen) return;
    L.rows = rows; L.counts = counts; L.error = null;
  } catch (e) { L.error = e.message; L.rows = []; }
  if (S.view === "list") render();
}

async function geocode(q) {
  const urls = [`https://data.geopf.fr/geocodage/search?q=${enc(q)}&limit=1`, `https://api-adresse.data.gouv.fr/search/?q=${enc(q)}&limit=1`];
  for (const u of urls) {
    try {
      const r = await fetch(u); if (!r.ok) continue;
      const j = await r.json(); const f = j.features?.[0];
      if (f) return { lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0], label: f.properties.label, city: f.properties.city, postcode: f.properties.postcode };
    } catch (_) { /* essai suivant */ }
  }
  return null;
}

async function submitAdd() {
  const name = $("#add-name").value.trim();
  if (!name) { toast("Indiquez le nom de l'entreprise."); return; }
  const phone = $("#add-phone").value.trim(), email = $("#add-email").value.trim(), addr = $("#add-addr").value.trim();
  const source = $("#add-source").value, days = Number($("#add-when").value), note = $("#add-note").value.trim();
  try {
    const dup = await api.findDuplicate(name, phone);
    if (dup && !S.addConfirmDup) {
      S.addConfirmDup = true;

  if (T.loading) return head + loadingBlock("Je calcule l'itinéraire et je cherche les horaires…");

  const pts = T.stops.filter((p) => p.lat != null);
  const origin = T.origin ? `&origin=${T.origin.lat},${T.origin.lng}` : "";
  const last = pts[pts.length - 1];
  const way = pts.slice(0, -1).slice(0, 8).map((p) => `${p.lat},${p.lng}`).join("|");
  const route = last ? `https://www.google.com/maps/dir/?api=1${origin}&destination=${last.lat},${last.lng}${way ? `&waypoints=${enc(way)}` : ""}&travelmode=driving` : null;
  const done = T.stops.filter((p) => p._done).length;
  return `${head}
  <section class="stack">
    ${progressHTML(done, T.stops.length, done > 1 ? "visites faites" : "visite faite", [
      [T.stops.filter((p) => p._done && p._tone === "go").length, "intéressé", "intéressés", "go"],
      [T.stops.filter((p) => p._done && p._tone === "wait").length, "à revoir", "à revoir", "wait"],
    ])}

    <div class="stops">${T.stops.map((p, k) => `

async function buildTour() {
  const T = S.tour;
  T.loading = true; T.error = null; render();
  try {
    let origin = { lat: S.settings.center.lat, lng: S.settings.center.lng };
    if (T.from === "gps") {
      origin = await new Promise((res, rej) => navigator.geolocation
        ? navigator.geolocation.getCurrentPosition((pos) => res({ lat: pos.coords.latitude, lng: pos.coords.longitude }), () => rej(new Error("Position indisponible : autorisez la localisation ou partez du point de départ.")), { timeout: 10000 })
        : rej(new Error("Localisation non disponible sur cet appareil.")));
    }
    const due = (await api.due(endOfToday())).filter((p) => p.status !== "rdv" && channelOf(p) === "visite" && p.lat != null);
    const fresh = (await api.fresh(40, due.map((p) => p.id), "visite")).filter((p) => p.lat != null);
    // les visites prévues passent en premier, puis les meilleurs prospects proches
    const picked = due.slice(0, T.count);
    const near = fresh.map((p) => ({ p, d: haversine(origin, p) })).sort((a, b) => (b.p.score - b.d * 2) - (a.p.score - a.d * 2));
    for (const x of near) { if (picked.length >= T.count) break; picked.push(x.p); }
    // ordre de passage : le plus proche à chaque étape
    const route = []; let cur = origin; const rest = [...picked];
    while (rest.length) {
      let bi = 0, bd = Infinity;
      rest.forEach((p, i) => { const d = haversine(cur, p); if (d < bd) { bd = d; bi = i; } });
      const [p] = rest.splice(bi, 1); p._leg = Math.round(bd * 10) / 10; route.push(p); cur = p;
    }
    const toEnrich = route.filter((p) => !p.enriched_at).map((p) => p.id);
    if (toEnrich.length) {
      const res = await api.fn("enrich", { ids: toEnrich });
      const byId = Object.fromEntries((res.prospects || []).map((p) => [p.id, p]));
      route.forEach((p, i) => { if (byId[p.id]) route[i] = Object.assign(byId[p.id], { _leg: p._leg }); });
    }
    for (const p of route) if (!p.channel) { p.channel = "visite"; api.update(p.id, { channel: "visite" }).catch(() => {}); }
    T.stops = route; T.origin = origin; T.open = null;
  } catch (e) { T.error = e.message; }
  T.loading = false;
  render();
}

async function exportCsv() {
  try {
    const rows = await api.exportAll();
    const cols = [["name", "Nom"], ["legal_name", "Raison sociale"], ["status", "Statut"], ["score", "Note"], ["phone", "Téléphone"], ["email", "E-mail"], ["address", "Adresse"], ["city", "Ville"], ["naf_label", "Activité"], ["headcount_label", "Effectif"], ["next_action", "Prochaine action"], ["next_action_at", "Date"], ["competitor", "Concurrent"], ["notes", "Notes"], ["siret", "SIRET"]];
    const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = [cols.map((c) => cell(c[1])).join(";")].concat(rows.map((r) => cols.map(([k]) => cell(k === "status" ? STATUS[r.status]?.label : k === "next_action_at" && r[k] ? fmtDay(r[k]) : r[k])).join(";")));
    const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `prospects-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { toast("Erreur : " + e.message, 4000); }
}

  logout: async () => { await api.logout(); S.user = null; S.view = "login"; render(); },
};

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  e.preventDefault();
  ACT[t.dataset.act]?.(t, e);
});
// toucher le fond de la feuille la ferme
document.addEventListener("click", (e) => { if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id && t.closest?.("#view")) t.dataset.typed = "1";
  if (t.dataset?.note) { (S.notes ||= {})[t.dataset.note] = t.value; }
  if (t.id === "st-radius") { const v = $("#st-radius-v"); if (v) v.textContent = t.value; }
  if (t.id === "list-q") {
    S.list.q = t.value;
    clearTimeout(ACT._q);
    ACT._q = setTimeout(() => { loadList(); }, 350);
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id && t.closest?.("#view")) t.dataset.typed = "1";
});
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  if (f.dataset.form === "setpass") {
    S.error = null;
    const a = $("#np-1").value, b = $("#np-2").value;
    if (a.length < 8) { S.error = "Au moins 8 caractères."; render(); return; }
    if (a !== b) { S.error = "Les deux mots de passe ne sont pas identiques."; render(); return; }
    try { await api.setPassword(a); S.recovering = false; history.replaceState(null, "", location.pathname); toast("Mot de passe enregistré"); await boot(); }
    catch (err) { S.error = /same|different/i.test(err.message) ? "C'est déjà votre mot de passe actuel : vous pouvez simplement vous connecter." : err.message; render(); }
  } else if (f.dataset.form === "login") {
    S.error = null;
    try { S.user = await api.login($("#login-email").value.trim(), $("#login-pass").value); await boot(); }
    catch (err) { S.error = err.message; render(); }
  } else if (f.dataset.form === "settings") saveSettingsForm();
  else if (f.dataset.form === "add") submitAdd();
});

/* =====================================================================
   16. Démarrage
   ===================================================================== */
api.onRecovery(() => { S.recovering = true; S.view = "setpass"; render(); });
async function boot() {
  try {
    S.user = await api.me();
    if (LINK_ERROR && !S.user) { S.error = /expired|invalid/i.test(LINK_ERROR) ? "Ce lien a expiré ou a déjà servi. Écrivez votre e-mail puis touchez « Mot de passe oublié ? » pour en recevoir un nouveau." : LINK_ERROR; }
    if (!S.user) { S.view = "login"; render(); return; }
    if (RECOVERY_LINK || S.recovering) { S.recovering = true; S.view = "setpass"; render(); return; }
    S.settings = mergeSettings(await api.getSettings());
    go("home");
  } catch (e) {
    $("#view").innerHTML = errorBlock("Connexion à la base impossible : " + e.message);
  }
}

boot();
</script>
</body>
</html>
